set timeout=10
set default=0

# Detect the boot device — GRUB knows which device it loaded from.
# $root is set by grub-mkrescue's embedded config; we pass it to the kernel.
# For CD/DVD boot: /dev/sr0.  For USB boot: /dev/sdX.
# We use root=LABEL=LLAMASTE so the kernel finds the ISO filesystem by volume label
# (set by grub-mkrescue -volid LLAMASTE).

# NOTE: root=LABEL= requires initramfs (udev/blkid). Without initramfs,
# the kernel's name_to_dev_t() only handles PARTUUID=, PARTLABEL=, ID=,
# and /dev/ paths. Use direct device paths instead.
#
# On NVMe laptops: NVMe = /dev/nvme0n1, USB stick = /dev/sda  (use entry 1)
# On SATA desktops: SATA = /dev/sda, USB stick = /dev/sdb    (use entry 2)

menuentry "Llamaste Live + Install  [USB on NVMe laptop: /dev/sda]" {
    search --no-floppy --set=root --label LLAMASTE
    linux /boot/bzImage root=/dev/sda rootfstype=iso9660 ro \
        console=tty0 console=ttyS0,115200 \
        init=/opt/llamaste/llamaste \
        llamaste.mode=live \
        ip=dhcp \
        rootwait \
        nomodeset
}

menuentry "Llamaste Live + Install  [USB on SATA desktop: /dev/sdb]" {
    search --no-floppy --set=root --label LLAMASTE
    linux /boot/bzImage root=/dev/sdb rootfstype=iso9660 ro \
        console=tty0 console=ttyS0,115200 \
        init=/opt/llamaste/llamaste \
        llamaste.mode=live \
        ip=dhcp \
        rootwait \
        nomodeset
}

menuentry "Llamaste Live + Install  [CD/DVD: /dev/sr0]" {
    search --no-floppy --set=root --label LLAMASTE
    linux /boot/bzImage root=/dev/sr0 rootfstype=iso9660 ro \
        console=tty0 console=ttyS0,115200 \
        init=/opt/llamaste/llamaste \
        llamaste.mode=live \
        ip=dhcp \
        rootwait \
        nomodeset
}

menuentry "Llamaste Live (verbose, /dev/sda)" {
    search --no-floppy --set=root --label LLAMASTE
    linux /boot/bzImage root=/dev/sda rootfstype=iso9660 ro \
        console=tty0 console=ttyS0,115200 \
        init=/opt/llamaste/llamaste \
        llamaste.mode=live \
        ip=dhcp \
        rootwait \
        nomodeset \
        loglevel=7 \
        ignore_loglevel
}

menuentry "Llamaste Live (serial only, /dev/sda)" {
    search --no-floppy --set=root --label LLAMASTE
    linux /boot/bzImage root=/dev/sda rootfstype=iso9660 ro quiet \
        console=ttyS0,115200 \
        init=/opt/llamaste/llamaste \
        llamaste.mode=live \
        ip=dhcp \
        rootwait \
        nomodeset
}
