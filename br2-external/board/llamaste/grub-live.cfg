set timeout=10
set default=0

# root=LABEL=LLAMASTE finds the ISO filesystem by volume label,
# working on USB (/dev/sdb), CD-ROM (/dev/sr0), and PXE sanboot.

menuentry "Llamaste Server - Live" {
    search --no-floppy --set=root --label LLAMASTE
    linux /boot/bzImage root=LABEL=LLAMASTE rootfstype=iso9660 ro \
        console=tty0 console=ttyS0,115200 \
        init=/opt/llamaste/llamaste \
        llamaste.mode=live \
        rootwait \
        nomodeset \
        loglevel=7 panic=30
    initrd /boot/initramfs.cpio.gz
}

# GPU variant: boots with amdgpu KMS ON so llama.cpp's Vulkan backend has a real
# device to offload to (needs RADV in the rootfs + amdgpu firmware). The plain
# (nomodeset) Server entry stays the default since the ISO boots on arbitrary,
# possibly GPU-buggy hardware; pick this on a known-good AMD box (e.g. EVO-X2).
menuentry "Llamaste Server - Live (GPU / amdgpu KMS)" {
    search --no-floppy --set=root --label LLAMASTE
    linux /boot/bzImage root=LABEL=LLAMASTE rootfstype=iso9660 ro \
        console=tty0 console=ttyS0,115200 \
        init=/opt/llamaste/llamaste \
        llamaste.mode=live \
        rootwait \
        amdgpu.modeset=1 \
        loglevel=7 panic=30
    initrd /boot/initramfs.cpio.gz
}

menuentry "Llamaste Desktop - Live" {
    search --no-floppy --set=root --label LLAMASTE
    linux /boot/bzImage root=LABEL=LLAMASTE rootfstype=iso9660 ro \
        console=tty0 console=ttyS0,115200 \
        init=/opt/llamaste/llamaste \
        llamaste.mode=desktop \
        rootwait \
        amdgpu.modeset=0
    initrd /boot/initramfs.cpio.gz
}

menuentry "Diagnostic - Kernel Test (static init)" {
    search --no-floppy --set=root --label LLAMASTE
    linux /boot/bzImage root=LABEL=LLAMASTE rootfstype=iso9660 ro \
        console=tty0 console=ttyS0,115200 \
        init=/opt/llamaste/diag_init \
        rootwait \
        nomodeset \
        loglevel=7
    initrd /boot/initramfs.cpio.gz
}
