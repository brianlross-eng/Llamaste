set timeout=10
set default=0

# Detect the boot device — GRUB knows which device it loaded from.
# $root is set by grub-mkrescue's embedded config; we pass it to the kernel.
# For CD/DVD boot: /dev/sr0.  For USB boot: /dev/sdX.
#
# NOTE: root=LABEL= requires initramfs (udev/blkid). Without initramfs,
# the kernel's name_to_dev_t() only handles PARTUUID=, PARTLABEL=, ID=,
# and /dev/ paths. Use direct device paths instead.
#
# On NVMe laptops: NVMe = /dev/nvme0n1, USB stick = /dev/sda  (use entries 1-2)
# On SATA desktops: SATA = /dev/sda, USB stick = /dev/sdb    (use entries 3-4)
#
# After boot, the live pivot mounts rootfs.squashfs via overlayfs so the
# full installed system (labwc, cog, wpa_supplicant, dhcpcd, etc.) is available.

menuentry "Llamaste Live + Install  [USB on NVMe laptop: /dev/sda]" {
    search --no-floppy --set=root --label LLAMASTE
    linux /boot/bzImage root=/dev/sda rootfstype=iso9660 ro \
        console=tty0 console=ttyS0,115200 \
        init=/opt/llamaste/llamaste \
        llamaste.mode=live \
        ip=dhcp \
        rootwait \
        nomodeset
}

