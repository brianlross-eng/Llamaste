set timeout=10
set default=0

# root=LABEL=LLAMASTE finds the ISO filesystem by volume label,
# working on USB (/dev/sdb), CD-ROM (/dev/sr0), and PXE sanboot.
#
# Default entries leave kernel mode-setting (KMS) ENABLED and vendor-neutral: the
# kernel and init bring up whatever GPU is present (amdgpu / i915 / nouveau, loaded
# adaptively by init's hardware detection), so llama.cpp's Vulkan backend has a real
# device to offload onto. No GPU-vendor flag is hardcoded here -- that decision belongs
# to runtime hardware detection, not the bootloader. The "safe mode" entry keeps
# nomodeset as a fallback for hardware where KMS hangs.

menuentry "Llamaste Server - Live" {
    search --no-floppy --set=root --label LLAMASTE
    linux /boot/bzImage root=LABEL=LLAMASTE rootfstype=iso9660 ro \
        console=tty0 console=ttyS0,115200 \
        init=/opt/llamaste/llamaste \
        llamaste.mode=live \
        rootwait \
        loglevel=7 panic=30
    initrd /boot/initramfs.cpio.gz
}

menuentry "Llamaste Desktop - Live" {
    search --no-floppy --set=root --label LLAMASTE
    linux /boot/bzImage root=LABEL=LLAMASTE rootfstype=iso9660 ro \
        console=tty0 console=ttyS0,115200 \
        init=/opt/llamaste/llamaste \
        llamaste.mode=desktop \
        rootwait \
        loglevel=7 panic=30
    initrd /boot/initramfs.cpio.gz
}

menuentry "Llamaste Server - Live (safe mode - no GPU)" {
    search --no-floppy --set=root --label LLAMASTE
    linux /boot/bzImage root=LABEL=LLAMASTE rootfstype=iso9660 ro \
        console=tty0 console=ttyS0,115200 \
        init=/opt/llamaste/llamaste \
        llamaste.mode=live \
        rootwait \
        nomodeset \
        loglevel=7 panic=30
    initrd /boot/initramfs.cpio.gz
}
