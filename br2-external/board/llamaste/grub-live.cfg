set timeout=10
set default=0

# root= must be a direct /dev/ path — LABEL= requires initramfs/udev (not present).
#
# Device assignment on this laptop (Intel Core Ultra 9 275HX):
#   /dev/sda  — SD card reader (internal, grabs the first SCSI slot)
#   /dev/sdb  — USB flash drive  ← this is the one that works
#   /dev/sdc  — fallback if another USB device is present
#   /dev/sr0  — CD/DVD
#   /dev/nvme0n1 — NVMe SSD (never the boot device from ISO)
#
# After boot the live pivot mounts rootfs.squashfs via overlayfs so the full
# installed system (labwc, cog, wpa_supplicant, dhcpcd, all libs) is available.

# ── DEFAULT ──────────────────────────────────────────────────────────────────

menuentry "Llamaste Live + Install  [USB /dev/sdb  ← use this one]" {
    search --no-floppy --set=root --label LLAMASTE
    linux /boot/bzImage root=/dev/sdb rootfstype=iso9660 ro \
        console=tty0 console=ttyS0,115200 \
        init=/opt/llamaste/llamaste \
        llamaste.mode=live \
        ip=dhcp \
        rootwait \
        nomodeset
}

menuentry "Llamaste Desktop (live)  [USB /dev/sdb]" {
    search --no-floppy --set=root --label LLAMASTE
    linux /boot/bzImage root=/dev/sdb rootfstype=iso9660 ro \
        console=tty0 console=ttyS0,115200 \
        init=/opt/llamaste/llamaste \
        llamaste.mode=desktop \
        ip=dhcp \
        rootwait
}

# ── FALLBACK (if another USB device is present and sdb is pushed to sdc) ───

menuentry "Llamaste Live + Install  [USB /dev/sdc  (fallback)]" {
    search --no-floppy --set=root --label LLAMASTE
    linux /boot/bzImage root=/dev/sdc rootfstype=iso9660 ro \
        console=tty0 console=ttyS0,115200 \
