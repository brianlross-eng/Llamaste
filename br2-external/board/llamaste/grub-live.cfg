set timeout=10
set default=0

# USB is usually /dev/sdb. If boot fails, press 'e' on an entry
# and change sdb→sda (or sdc), then Ctrl+X to boot.

menuentry "Llamaste" {
    search --no-floppy --set=root --label LLAMASTE
    linux /boot/bzImage root=/dev/sdb rootfstype=iso9660 ro \
        console=tty0 console=ttyS0,115200 \
        init=/opt/llamaste/llamaste \
        llamaste.mode=live \
        rootwait \
        nomodeset
}

menuentry "Llamaste  (desktop)" {
    search --no-floppy --set=root --label LLAMASTE
    linux /boot/bzImage root=/dev/sdb rootfstype=iso9660 ro \
        console=tty0 console=ttyS0,115200 \
        init=/opt/llamaste/llamaste \
        llamaste.mode=desktop \
        rootwait
}
