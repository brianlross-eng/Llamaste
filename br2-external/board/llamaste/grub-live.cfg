set timeout=10
set default=0

# Detect the boot device — GRUB knows which device it loaded from.
# $root is set by grub-mkrescue's embedded config; we pass it to the kernel.
# For CD/DVD boot: /dev/sr0.  For USB boot: /dev/sdX.
# We use root=LABEL=LLAMASTE so the kernel finds the ISO filesystem by volume label
# (set by grub-mkrescue -volid LLAMASTE).

menuentry "Llamaste Live + Install" {
    search --no-floppy --set=root --label LLAMASTE
    linux /boot/bzImage root=LABEL=LLAMASTE rootfstype=iso9660 ro quiet \
        console=tty0 console=ttyS0,115200 \
        init=/opt/llamaste/llamaste \
        llamaste.mode=live \
        ip=dhcp \
        rootwait
}

menuentry "Llamaste Live (serial only)" {
    search --no-floppy --set=root --label LLAMASTE
    linux /boot/bzImage root=LABEL=LLAMASTE rootfstype=iso9660 ro quiet \
        console=ttyS0,115200 \
        init=/opt/llamaste/llamaste \
        llamaste.mode=live \
        ip=dhcp \
        rootwait
}
