set timeout=10
set default=0

menuentry "Llamaste Live + Install" {
    linux /boot/bzImage rootfstype=iso9660 ro quiet \
        console=ttyS0 console=tty0 \
        init=/opt/llamaste/llamaste \
        llamaste.mode=live \
        ip=dhcp
}

menuentry "Llamaste Live (serial only)" {
    linux /boot/bzImage rootfstype=iso9660 ro quiet \
        console=ttyS0 \
        init=/opt/llamaste/llamaste \
        llamaste.mode=live \
        ip=dhcp
}
