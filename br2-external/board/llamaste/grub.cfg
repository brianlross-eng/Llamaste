set timeout=10
set default=0

# Load saved environment variables from grubenv
load_env

# Default to slot A if active_slot not set
if [ -z "${active_slot}" ]; then
    set active_slot=A
fi

# Boot counter rollback logic
if [ "${boot_success}" = "0" ]; then
    if [ -n "${boot_counter}" ]; then
        if [ "${boot_counter}" = "0" ]; then
            if [ "${active_slot}" = "A" ]; then
                set active_slot=B
            else
                set active_slot=A
            fi
            save_env active_slot
            set boot_counter=
            save_env boot_counter
        else
            if [ "${boot_counter}" = "3" ]; then set boot_counter=2; fi
            if [ "${boot_counter}" = "2" ]; then set boot_counter=1; fi
            if [ "${boot_counter}" = "1" ]; then set boot_counter=0; fi
            save_env boot_counter
        fi
    fi
fi

# Default entries leave kernel mode-setting (KMS) ENABLED and vendor-neutral: the kernel
# and init bring up whatever GPU is present (amdgpu / i915 / nouveau, loaded adaptively by
# init's hardware detection), so llama.cpp's Vulkan backend has a real device to offload
# onto. We do NOT hardcode any vendor flag (e.g. amdgpu.modeset=1) here — that decision
# belongs to runtime hardware detection, not the bootloader.
#
# The old default forced `nomodeset`, which disables KMS for EVERY GPU vendor -> no Vulkan
# device -> llama-server silently on CPU. The "safe mode" entries below keep `nomodeset`
# as a fallback for hardware where KMS hangs (or a headless box with a flaky GPU).
menuentry "Llamaste Server" {
    linux /bzImage rootfstype=squashfs ro \
        console=ttyS0,115200 console=tty0 \
        init=/opt/llamaste/llamaste \
        ip=dhcp panic=30 \
        llamaste.mode=server llamaste.slot=${active_slot}
    initrd /initramfs.cpio.gz
}

menuentry "Llamaste Server (safe mode - no GPU)" {
    linux /bzImage rootfstype=squashfs ro \
        console=ttyS0,115200 console=tty0 \
        init=/opt/llamaste/llamaste \
        ip=dhcp panic=30 nomodeset \
        llamaste.mode=server llamaste.slot=${active_slot}
    initrd /initramfs.cpio.gz
}

menuentry "Llamaste Desktop" {
    linux /bzImage rootfstype=squashfs ro \
        console=ttyS0,115200 console=tty0 \
        init=/opt/llamaste/llamaste \
        ip=dhcp panic=30 \
        llamaste.mode=desktop llamaste.slot=${active_slot}
    initrd /initramfs.cpio.gz
}

menuentry "Llamaste Desktop (safe mode - no GPU)" {
    linux /bzImage rootfstype=squashfs ro \
        console=ttyS0,115200 console=tty0 \
        init=/opt/llamaste/llamaste \
        ip=dhcp panic=30 nomodeset \
        llamaste.mode=desktop llamaste.slot=${active_slot}
    initrd /initramfs.cpio.gz
}
