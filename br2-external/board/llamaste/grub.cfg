set timeout=5
set default=0

# The kernel (bzImage) lives on the ESP, which is partition 2 (gpt2).
# GRUB's $root is already set to the ESP by the embedded prefix.
# The root filesystem is squashfs on partition 3 (SYS-A).
#
# We use root=/dev/sda3 for SATA/virtio disks. For NVMe it would be
# /dev/nvme0n1p3 — a future update can auto-detect via GRUB scripting.

menuentry "Llamaste Server" {
    linux /bzImage root=/dev/sda3 rootfstype=squashfs ro \
        console=tty0 console=ttyS0,115200 \
        init=/opt/llamaste/llamaste \
        llamaste.mode=server \
        ip=dhcp
}

menuentry "Llamaste Desktop" {
    linux /bzImage root=/dev/sda3 rootfstype=squashfs ro quiet \
        console=tty0 console=ttyS0,115200 \
        init=/opt/llamaste/llamaste \
        llamaste.mode=desktop \
        ip=dhcp
}
