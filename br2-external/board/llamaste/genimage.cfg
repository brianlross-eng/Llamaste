# Llamaste 5-partition GPT disk image layout
#
# Partition table:
#   1. BIOS boot    (1 MB)   - GRUB BIOS core image for legacy boot
#   2. ESP          (256 MB) - EFI System Partition: GRUB EFI + grub.cfg + kernel
#   3. SYS-A        (256 MB) - Active root: squashfs (kernel + llamaste binary)
#   4. SYS-B        (256 MB) - Reserved for A/B updates (empty in Phase 1)
#   5. DATA          (1 GB)  - Persistent storage: models, config, conversations
#
# On real hardware, flash with: dd if=llamaste.img of=/dev/sdX bs=4M status=progress
# Then expand DATA partition: growpart /dev/sdX 5 && resize2fs /dev/sdX5

# --- Sub-images ---

# EFI System Partition contents
# Buildroot's GRUB2 package places EFI binaries in ${BINARIES_DIR}/efi-part/
# post_build.sh copies grub.cfg and bzImage into the EFI partition structure
image efi-part.vfat {
    vfat {
        label = "ESP"
        file EFI {
            image = "efi-part/EFI"
        }
        file grub {
            image = "efi-part/grub"
        }
        files = {
            "bzImage"
        }
    }
    size = 256M
}

# Root filesystem (read-only, compressed)
image rootfs.squashfs {
    squashfs {
        compression = "zstd"
        block-size = 0x40000
    }
}

# Persistent data partition
# Pre-populated with directory structure by post_image.sh
image data.ext4 {
    ext4 {
        label = "DATA"
        use-creation-time = true
    }
    size = 1G
    mountpoint = "/data"
}

# --- Final disk image ---

image llamaste.img {
    hdimage {
        gpt = true
    }

    # Partition 1: GRUB BIOS boot (for legacy/CSM boot)
    # Type: BIOS boot partition (EF02)
    partition bios-boot {
        in-partition-table = true
        partition-type-uuid = "21686148-6449-6E6F-744E-656564454649"
        image = "grub-bios.img"
        size = 1M
    }

    # Partition 2: EFI System Partition (for UEFI boot)
    # Type: EFI System (EF00)
    partition esp {
        partition-type-uuid = "C12A7328-F81F-11D2-BA4B-00A0C93EC93B"
        bootable = true
        image = "efi-part.vfat"
        size = 256M
    }

    # Partition 3: Active root filesystem (SYS-A)
    # Type: Linux filesystem
    partition sys-a {
        partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
        image = "rootfs.squashfs"
        size = 256M
    }

    # Partition 4: Standby root filesystem (SYS-B)
    # Type: Linux filesystem (empty, reserved for A/B updates)
    partition sys-b {
        partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
        size = 256M
    }

    # Partition 5: Persistent data
    # Type: Linux filesystem
    # autoresize: expands to fill disk when flashed to real hardware
    partition data {
        partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
        image = "data.ext4"
        autoresize = true
        size = 1G
    }
}
