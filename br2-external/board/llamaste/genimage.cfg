# Llamaste GPT disk image layout
# Sub-images (efi-part.vfat, data.ext4) are pre-built by post_image.sh
# rootfs.squashfs and grub-bios.img come from Buildroot / post_image.sh

image llamaste.img {
    hdimage {
        gpt = true
        # Align partitions to 1 MiB boundaries — required for VirtualBox EFI
        # and recommended for SSD/4K-sector disk performance.
        align = 1M
    }

    # Partition 1: GRUB BIOS boot (legacy)
    partition bios-boot {
        in-partition-table = true
        partition-type-uuid = "21686148-6449-6E6F-744E-656564454649"
        image = "grub-bios.img"
        size = 1M
    }

    # Partition 2: EFI System Partition
    partition esp {
        partition-type-uuid = "C12A7328-F81F-11D2-BA4B-00A0C93EC93B"
        bootable = true
        image = "efi-part.vfat"
    }

    # Partition 3: Root filesystem (squashfs, read-only)
    # Size increased for desktop mode (Wayland + Mesa + WPEWebKit)
    partition sys-a {
        partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
        image = "rootfs.squashfs"
        size = 256M
    }

    # Partition 4: Standby root (A/B updates, empty)
    partition sys-b {
        partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
        size = 256M
    }

    # Partition 5: Persistent data
    partition data {
        partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
        image = "data.ext4"
    }
}
